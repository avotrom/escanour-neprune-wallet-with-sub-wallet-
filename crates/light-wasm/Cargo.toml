[package]
name = "light-wasm"
description = "wasm-bindgen bindings for the light wallet (sync, scan, build transactions). No prover inside: keeps this module small."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
light-core = { path = "../light-core" }
anyhow.workspace = true
bincode.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
serde-wasm-bindgen.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Reads a QR code from an imported picture (Send > Import). Pure Rust, no image crate.
rqrr = { version = "0.7", default-features = false }

# Enable the browser randomness backend for every getrandom version in the
# dependency graph. Check with:
#   cargo tree -i getrandom --target wasm32-unknown-unknown
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
