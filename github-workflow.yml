# Paste this into GitHub: Actions -> "set up a workflow yourself" -> commit.
# (It must live at .github/workflows/; GitHub creates that folder for you.)
#
# Builds the extension on GitHub's servers: nothing to install locally.
# Result: an "escanour-wallet" download on the workflow run page, plus the
# "neptune-light" command-line tool for macOS (it makes archive snapshots from
# your own node). A pushed tag (v*) also attaches both to a GitHub release.
# If the build fails, the "Check" step's log shows the compiler errors.
name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # only used to attach the builds to a release on a tag

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript checks and regression tests
        run: |
          node tests/check-syntax.mjs
          node --test tests/*.test.mjs

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Vendor neptune-core and apply the wasm patch
        run: scripts/vendor-neptune.sh

      - name: Check (native + wasm32)
        run: scripts/check-wasm.sh 2>&1 | tee check.log; exit ${PIPESTATUS[0]}

      - name: Build wasm modules
        run: scripts/build.sh

      - name: Package the extension
        run: cd extension && zip -qr ../escanour-wallet.zip .

      - name: Upload the extension
        uses: actions/upload-artifact@v4
        with:
          name: escanour-wallet
          path: extension/

      - name: Attach the extension to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "RELEASE-${GITHUB_REF_NAME#v}.md" --prerelease || true
          gh release upload "$GITHUB_REF_NAME" escanour-wallet.zip --clobber

      - name: Upload the check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: check.log
          if-no-files-found: ignore

  # The command-line tool, for the Mac that runs your own node:
  #   neptune-light --server http://127.0.0.1:9797 archive-export
  cli-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Vendor neptune-core and apply the wasm patch
        run: chmod +x scripts/*.sh && scripts/vendor-neptune.sh
      - name: Build
        run: RUST_MIN_STACK=33554432 cargo build --release -p light-cli
      - name: Package
        run: cd target/release && zip -q ../../neptune-light-macos.zip neptune-light
      - uses: actions/upload-artifact@v4
        with:
          name: neptune-light-macos
          path: target/release/neptune-light
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "RELEASE-${GITHUB_REF_NAME#v}.md" --prerelease || true
          gh release upload "$GITHUB_REF_NAME" neptune-light-macos.zip --clobber
