# Paste this into GitHub: Actions -> "set up a workflow yourself" -> commit.
# (It must live at .github/workflows/; GitHub creates that folder for you.)
#
# Builds the extension on GitHub's servers: nothing to install locally.
# Result: two downloads on the workflow run page:
#   escanour-light  the wallet without a node
#   escanour-node   the wallet with the succinct node
# A pushed tag (v*) also attaches both as zip files to a GitHub release.
# If the build fails, the "Check" step's log shows the compiler errors.
name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # only used to attach the builds to a release on a tag

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript checks and regression tests
        run: |
          node tests/check-syntax.mjs
          node --test tests/*.test.mjs

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Vendor neptune-core and apply the wasm patch
        run: scripts/vendor-neptune.sh

      - name: Check (native + wasm32)
        run: scripts/check-wasm.sh 2>&1 | tee check.log; exit ${PIPESTATUS[0]}

      - name: Build wasm modules
        run: scripts/build.sh

      - name: Rust unit tests (succinct verdicts)
        run: RUST_MIN_STACK=33554432 cargo test -p light-core succinct

      - name: Cut the two builds
        run: scripts/package.sh

      - name: Upload the light build (no node)
        uses: actions/upload-artifact@v4
        with:
          name: escanour-light
          path: dist/escanour-light/

      - name: Upload the node build (succinct node)
        uses: actions/upload-artifact@v4
        with:
          name: escanour-node
          path: dist/escanour-node/

      - name: Attach both builds to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "RELEASE-${GITHUB_REF_NAME#v}.md" --prerelease
          gh release upload "$GITHUB_REF_NAME" dist/escanour-light.zip dist/escanour-node.zip --clobber

      - name: Upload the check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: check.log
          if-no-files-found: ignore
