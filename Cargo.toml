[workspace]
resolver = "2"
members = [
    "crates/light-core",
    "crates/light-wasm",
    "crates/prover-wasm",
    "crates/light-cli",
]
# vendor/neptune-core is its own workspace; its crates are path dependencies here.
exclude = ["vendor"]

[workspace.package]
version = "0.23.0-alpha.1"
edition = "2021"
# Proprietary, all rights reserved: see LICENSE. Never published to crates.io.
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/avotrom/neptune-light"

# Neptune crates come from a vendored, pinned copy of neptune-core with a small
# wasm32 patch applied (see scripts/vendor-neptune.sh and patches/).
# Nothing in upstream Neptune is changed; the patch lives only in this repo.
[workspace.dependencies]
neptune-consensus = { path = "vendor/neptune-core/neptune-consensus" }
neptune-mutator-set = { path = "vendor/neptune-core/neptune-mutator-set" }
neptune-primitives = { path = "vendor/neptune-core/neptune-primitives" }
neptune-wallet = { path = "vendor/neptune-core/neptune-wallet" }
neptune-rpc-api = { path = "vendor/neptune-core/neptune-rpc/api" }

anyhow = "1.0"
bincode = "1.3"
itertools = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

# Triton VM dominates proving time; never build it unoptimised.
[profile.dev.package.triton-vm]
opt-level = 3

[profile.dev.package.twenty-first]
opt-level = 3
